<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script src="/baremux/index.js"></script>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
            await navigator.serviceWorker.register("/uv/sw.js");
        });
    }
    </script>
    <style>
        :root {
            --primary-color: #a855f7;
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: #050505;
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- UI COMPONENTS THAT WILL FADE OUT --- */
        .fade-target {
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
            opacity: 1;
            visibility: visible;
        }

        /* Class to trigger disappearance */
        .ui-hidden {
            opacity: 0 !important;
            transform: translateY(-20px);
            visibility: hidden !important;
            pointer-events: none;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 40px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
        }

        .nav-btn {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 15px rgba(168, 85, 247, 0.2);
        }

        /* Search Layout */
        .search-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .logo {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #fff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #urlInput {
            width: 600px;
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(20px);
            color: white;
            font-size: 18px;
            outline: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        /* Proxy Viewport */
        #iframeWindow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            z-index: 1; /* Below the UI but fills the screen */
            background: #fff;
        }
        #iframeWindow.active { display: block; }

        /* Games Modal */
        #games-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        #games-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(4, 120px);
            gap: 20px;
        }

        .game-card {
            background: #1e1e1e;
            aspect-ratio: 1/1;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .game-card img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <nav id="topNav" class="fade-target">
        <button class="nav-btn" onclick="toggleGames()">🎮 Games</button>
        <button class="nav-btn" id="transportBtn" onclick="toggleTransport()">⚡ Engine: V2</button>
    </nav>

    <div class="search-container fade-target" id="searchUI">
        <div class="logo">BEE'S VAULT</div>
        <input type="text" id="urlInput" placeholder="Enter URL or search..." autocomplete="off">
    </div>

    <div id="games-modal">
        <div class="games-grid">
            <a href="https://example.com" class="game-card"><img src="images/game1.png" alt="Game 1"></a>
            <a href="https://example.com" class="game-card"><img src="images/game2.png" alt="Game 2"></a>
            <a href="https://example.com" class="game-card"><img src="images/game3.png" alt="Game 3"></a>
            <a href="https://example.com" class="game-card"><img src="images/game4.png" alt="Game 4"></a>
        </div>
        <button class="nav-btn" style="margin-top: 20px;" onclick="toggleGames()">Close</button>
    </div>

    <iframe id="iframeWindow"></iframe>

    <script>
        // --- PROXY & UI LOGIC ---
        const urlInput = document.getElementById('urlInput');
        const iframe = document.getElementById('iframeWindow');
        const topNav = document.getElementById('topNav');
        const searchUI = document.getElementById('searchUI');
        const transportBtn = document.getElementById('transportBtn');
        const gamesModal = document.getElementById('games-modal');
        
        let currentTransport = 'epoxy'; 

        async function toggleTransport() {
            const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
            if (currentTransport === 'epoxy') {
                currentTransport = 'bare';
                transportBtn.innerText = '🚀 Engine: V1';
                await connection.setTransport("/epoxy/index.mjs", [{ wisp: "wss://wisp.mercurywork.shop/" }]);
            } else {
                currentTransport = 'epoxy';
                transportBtn.innerText = '⚡ Engine: V2';
                await connection.setTransport("/epoxy/index.mjs", [{ wisp: "wss://wisp.mercurywork.shop/" }]);
            }
        }

        function toggleGames() {
            gamesModal.classList.toggle('open');
        }

        urlInput.addEventListener('keydown', async (event) => {
            if (event.key === 'Enter') {
                let url = urlInput.value.trim();
                if (!url) return;

                if (!(url.startsWith('https://') || url.startsWith('http://'))) {
                    if (url.includes('.') && !url.includes(' ')) {
                        url = 'https://' + url;
                    } else {
                        url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
                    }
                }

                topNav.classList.add('ui-hidden');
                searchUI.classList.add('ui-hidden');
                iframe.classList.add('active');

                try {
                    await navigator.serviceWorker.register('/uv/sw.js', {
                        scope: __uv$config.prefix
                    });
                    iframe.src = __uv$config.prefix + __uv$config.encodeUrl(url);
                } catch (e) {
                    console.error(e);
                }
            }
        });

        // --- BACKGROUND ANIMATION ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(168, 85, 247, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 70; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
